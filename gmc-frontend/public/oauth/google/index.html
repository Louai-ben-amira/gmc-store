<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Google Auth</title></head>
<body>
<script>
  // Parse token from hash (implicit flow) or query params
  var hash   = window.location.hash.substring(1)
  var params = new URLSearchParams(hash || window.location.search)
  var token  = params.get('access_token')
  var error  = params.get('error')
  if (window.opener) {
    window.opener.postMessage({ type: 'gmc:oauth:google', token: token, error: error }, window.location.origin)
  }
  window.close()
</script>
</body>
</html>
